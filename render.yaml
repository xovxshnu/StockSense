# Optional Render blueprint for the backend. Secrets are set in the dashboard.
services:
  - type: web
    name: stocksense-api
    runtime: docker
    rootDir: backend
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      # Required: signs JWTs (>= 32 chars); the app refuses to start without it.
      - key: SECRET_KEY
        generateValue: true
